name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install

      - name: Build shared-types
        run: pnpm --filter @pdf-to-rag-chunks/shared-types build

      - name: Lint web
        run: pnpm --filter @pdf-to-rag-chunks/web lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit tests (TS)
        run: pnpm --filter @pdf-to-rag-chunks/shared-types test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -r apps/worker/requirements.txt

      - name: Worker unit tests
        working-directory: apps/worker
        run: PYTHONPATH=src python -m pytest -q

      - name: Build web
        run: pnpm --filter @pdf-to-rag-chunks/web build
        env:
          NEXT_PUBLIC_WORKER_URL: http://localhost:8080

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f docker-compose.yml config

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t pdf-rag-worker:test apps/worker
