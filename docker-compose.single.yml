services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.single
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      NEXT_PUBLIC_WORKER_URL: http://localhost:8080
      WORKER_JOBS_DIR: /data/jobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
