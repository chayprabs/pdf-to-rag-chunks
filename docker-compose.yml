services:
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      WORKER_JOBS_DIR: /data/jobs
    volumes:
      - worker-data:/data/jobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_WORKER_URL: http://worker:8080
    depends_on:
      worker:
        condition: service_healthy

volumes:
  worker-data:
